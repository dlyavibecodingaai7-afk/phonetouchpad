name: Build

on:
  push:
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unpack
        shell: bash
        run: python -m zipfile -e "$(ls *.zip | head -n1)" src
      - name: Install dependencies
        working-directory: src/windows
        run: python -m pip install -r requirements.txt
      - name: Test protocol
        working-directory: src/windows
        run: python test_protocol.py
      - name: Build exe
        working-directory: src/windows
        run: pyinstaller --onefile --noconsole --name PhoneTouchpad --hidden-import=pystray._win32 --collect-submodules pystray mouse_host.py
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneTouchpad-exe
          path: src/windows/dist/PhoneTouchpad.exe

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Unpack
        run: python3 -m zipfile -e "$(ls *.zip | head -n1)" src
      - name: Install Android platform
        run: sdkmanager "platforms;android-36"
      - name: Build apk
        working-directory: src/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneTouchpad-apk
          path: src/android/app/build/outputs/apk/debug/app-debug.apk
